  <!-- TOP TOOLBAR (Apple macOS / iPadOS HIG Light Glass, 52px) -->
  <header class="sticky top-0 z-50 glass-light h-[54px] px-6 flex items-center justify-between">
    <!-- Left: Brand Logo & Title -->
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-[8px] bg-[#007AFF] flex items-center justify-center text-white shadow-sm">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2c0 4-5 6-5 10a5 5 0 0 0 10 0c0-4-5-6-5-10z"></path>
          <path d="M12 14a2 2 0 1 0 0 4 2 2 0 0 0 0-4z" fill="currentColor"></path>
        </svg>
      </div>
      <div class="flex items-baseline gap-1.5">
        <span class="text-[17px] font-bold tracking-tight text-black">BurnScan</span>
        <span class="text-[11px] font-semibold px-2 py-0.5 rounded bg-blue-50 text-[#007AFF] border border-blue-200/50">ER Triage Clinical</span>
      </div>
    </div>

    <!-- Center: Main Navigation Modes -->
    <div class="segmented-control">
      <button class="segmented-btn active" id="nav-btn-assessment" onclick="switchMainView('assessment')">
        <span class="material-symbols-outlined text-[16px]">local_hospital</span>
        <span>Đánh giá ca mới</span>
      </button>
      <button class="segmented-btn" id="nav-btn-history" onclick="toggleHistoryDrawer(true)">
        <span class="material-symbols-outlined text-[16px]">folder_shared</span>
        <span>Hồ sơ bệnh án</span>
        <span id="history-badge-count" class="px-1.5 py-0.2 rounded-full text-[10px] bg-blue-600 text-white font-bold ml-1">3</span>
      </button>
      <button class="segmented-btn" id="nav-btn-chat" onclick="openAssistantModal()">
        <span class="material-symbols-outlined text-[16px]">chat_bubble</span>
        <span>Trợ lý Y khoa RAG</span>
      </button>
    </div>

    <!-- Right: Model Readiness & Status -->
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/80 border border-[rgba(60,60,67,0.12)] shadow-xs">
        <span class="w-2.5 h-2.5 rounded-full bg-[#248A3D] animate-pulse"></span>
        <span class="text-[12px] font-medium text-[rgba(60,60,67,0.85)]">U-Net & ResNet-34 Sẵn sàng</span>
      </div>
    </div>
  </header>
