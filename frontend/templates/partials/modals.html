  <!-- ========================================================================= -->
  <!-- MODAL: CHỤP ẢNH TỪ WEBCAM / CAMERA -->
  <!-- ========================================================================= -->
  <div id="camera-modal" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-xl shadow-2xl flex flex-col overflow-hidden border border-gray-200">
      
      <!-- Modal Header -->
      <div class="px-5 py-3.5 glass-light flex items-center justify-between border-b border-gray-200">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-[#007AFF] text-white flex items-center justify-center shadow-xs">
            <span class="material-symbols-outlined text-[18px]">photo_camera</span>
          </div>
          <h3 class="text-[16px] font-bold text-gray-900">Chụp ảnh vết bỏng qua Camera</h3>
        </div>
        <button onclick="closeCameraModal()" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-700 flex items-center justify-center transition-all">
          <span class="material-symbols-outlined text-[18px]">close</span>
        </button>
      </div>

      <!-- Live Video Viewport -->
      <div class="p-4 bg-gray-950 flex items-center justify-center relative min-h-[320px]">
        <div id="camera-loading" class="absolute flex flex-col items-center gap-2 text-white/70">
          <span class="material-symbols-outlined text-[32px] animate-spin">progress_activity</span>
          <span class="text-[13px]">Đang kết nối camera...</span>
        </div>
        <video id="camera-video" autoplay playsinline muted class="w-full max-h-[380px] object-contain rounded-xl shadow-inner relative z-10"></video>
        <div class="absolute inset-6 border border-white/30 border-dashed rounded-xl pointer-events-none flex items-end justify-center pb-3 z-20">
          <span class="text-white/80 text-[12px] bg-black/50 px-3 py-1 rounded-full backdrop-blur-xs">Căn chỉnh vết bỏng và thước đo vào giữa khung</span>
        </div>
      </div>

      <!-- Action Footer -->
      <div class="px-5 py-3.5 bg-gray-50 border-t border-gray-200 flex items-center justify-between">
        <button onclick="closeCameraModal()" class="h-10 px-4 rounded-xl border border-gray-300 bg-white hover:bg-gray-100 text-gray-700 font-medium text-[13px] transition-all">
          Hủy bỏ
        </button>
        <button onclick="captureCameraPhoto()" class="h-10 px-6 rounded-xl bg-[#007AFF] hover:bg-[#006ee6] text-white font-semibold text-[14px] flex items-center gap-2 shadow-sm transition-all active:scale-[0.98]">
          <span class="material-symbols-outlined text-[20px]">camera</span>
          <span>Chụp ảnh này</span>
        </button>
      </div>

    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- TOAST NOTIFICATION CONTAINER -->
  <!-- ========================================================================= -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 hidden px-4 py-2.5 rounded-xl bg-gray-900/90 text-white text-[13px] font-medium shadow-xl backdrop-blur-md flex items-center gap-2 transition-all">
    <span class="material-symbols-outlined text-[18px] text-emerald-400" id="toast-icon">check_circle</span>
    <span id="toast-message">Đã hoàn thành</span>
  </div>
